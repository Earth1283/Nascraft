name: Nascraft
version: '${version}'
main: me.bounser.nascraft.Nascraft
api-version: '1.21'
folia-supported: true
softdepend: [ Vault, PlaceholderAPI, AdvancedGUI, DiscordSRV ]
authors: [ bounser ]
description: Market valuations in minecraft

libraries:
  - org.xerial:sqlite-jdbc:3.43.0.0
  - com.mysql:mysql-connector-j:8.4.0
  - net.dv8tion:JDA:5.0.0-beta.18
  - jfree:jfreechart:1.0.13
  - com.zaxxer:HikariCP:5.1.0
  - redis.clients:jedis:5.1.2
  - org.jetbrains.kotlin:kotlin-stdlib:2.1.21
permissions:
  nascraft.economy:
    description: View the server economy overview (/economy).
    default: true
  nascraft.economy.admin:
    description: Adjust the treasury, trigger market shocks and reload economy.yml.
    default: op
  nascraft.economy.ubi:
    description: Receive the treasury's citizen dividend (UBI).
    default: true
  nascraft.web:
    description: Get a web dashboard login code.
    default: true
